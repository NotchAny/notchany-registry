name: 可信 PR 检查
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  validate:
    concurrency:
      group: market-pr-${{ inputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-pr.mjs
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          MARKET_API_BASE: ${{ vars.MARKET_API_BASE }}
          MARKET_INTERNAL_HMAC_SECRET: ${{ secrets.MARKET_INTERNAL_HMAC_SECRET }}
